<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Attrition Dashboard — TP Case Study</title>
<style>
:root{
  --tp-blue:#003D77; --tp-blue-d:#002B55; --tp-green:#00AC4F; --tp-teal:#398A83;
  --tp-gb:#7596B5; --risk:#D03B3B; --warn:#E8A33D;
  --ink:#12212F; --ink2:#5A6B7B; --mut:#8C9AA8;
  --surf:#FFFFFF; --page:#EEF3F8; --line:#DDE6EF; --line2:#EAF0F6;
  --sh:0 1px 2px rgba(0,43,85,.05),0 4px 16px rgba(0,43,85,.06);
  --sh2:0 8px 28px rgba(0,43,85,.14);
  --r:12px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.012em}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:linear-gradient(175deg,var(--tp-blue-d) 0%,#00193A 100%);color:#fff;
  padding:22px 0 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 20px 20px;
  border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:16px}
.brand .name{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.brand .sub{font-size:10.5px;color:#8FB4D6;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
nav{padding:0 12px}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;border-radius:9px;
  color:#B6CFE6;font-size:13.5px;font-weight:520;margin-bottom:3px;text-align:left;
  transition:background .16s,color .16s;position:relative}
.nv:hover{background:rgba(255,255,255,.07);color:#fff}
.nv.on{background:rgba(0,172,79,.16);color:#fff;font-weight:600}
.nv.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--tp-green)}
.nv svg{flex:none;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:18px 20px 0;font-size:11px;color:#6E93B8;line-height:1.7}
.side-foot b{color:#B6CFE6;font-weight:600}
main{padding:0 0 48px;min-width:0}
.top{background:var(--surf);border-bottom:1px solid var(--line);padding:18px 32px;
  position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap}
.top h1{font-size:21px;color:var(--tp-blue-d)}
.top .lede{color:var(--ink2);font-size:13px;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#F1F6FB;border:1px solid var(--line);border-radius:20px;padding:5px 13px;
  font-size:12px;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--tp-blue);font-weight:650}
.chip.r b{color:var(--risk)}
.pg{padding:26px 32px 0;display:none;animation:fade .34s ease}
.pg.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* ---------- cards ---------- */
.row{display:grid;gap:18px;margin-bottom:18px}
.c5{grid-template-columns:repeat(5,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:repeat(2,1fr)}
.c23{grid-template-columns:1.62fr 1fr}.c32{grid-template-columns:1fr 1.62fr}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;
  box-shadow:var(--sh);position:relative;transition:box-shadow .2s,transform .2s;min-width:0}
.card:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
.ct{font-size:12.5px;color:var(--ink2);font-weight:560}
.cs{font-size:11.5px;color:var(--mut);margin-top:1px}
.kv{font-size:33px;font-weight:680;color:var(--tp-blue);letter-spacing:-.025em;line-height:1.1;
  font-variant-numeric:tabular-nums;margin-top:6px}
.kv.risk{color:var(--risk)} .kv.good{color:#068A42} .kv.warn{color:#B8791C}
.kd{font-size:11.5px;color:var(--ink2);margin-top:5px;display:flex;align-items:center;gap:5px}
.kd .up{color:var(--risk);font-weight:640}.kd .dn{color:#068A42;font-weight:640}
.spk{margin-top:9px;height:34px}
/* info tooltip */
.i{width:19px;height:19px;border-radius:50%;border:1.4px solid var(--line);color:var(--mut);
  font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;
  transition:.16s;font-family:Georgia,serif}
.i:hover{border-color:var(--tp-blue);color:var(--tp-blue);background:#F1F6FB}
.tip{position:fixed;z-index:99;max-width:355px;background:#0B1E31;color:#DCE9F5;
  border-radius:10px;padding:14px 16px;font-size:12.5px;line-height:1.62;
  box-shadow:0 14px 40px rgba(0,15,35,.42);opacity:0;pointer-events:none;
  transition:opacity .15s;border:1px solid rgba(255,255,255,.09)}
.tip.on{opacity:1}
.tip h5{margin:0 0 6px;font-size:13px;color:#fff;font-weight:640}
.tip .lbl{display:block;margin:9px 0 3px;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:#5EC98D;font-weight:700}
.tip code{display:block;background:rgba(255,255,255,.07);border-radius:6px;padding:8px 10px;
  font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#9FDCBB;
  white-space:pre-wrap;margin-top:2px;line-height:1.5}
/* charts */
.vt{font-size:14px;font-weight:620;color:var(--tp-blue-d);margin-bottom:1px}
.vs{font-size:11.5px;color:var(--mut);margin-bottom:12px}
svg.g{width:100%;height:auto;display:block;overflow:visible}
.g .lb{font-size:11.5px;fill:var(--ink2)}
.g .vl{font-size:11.5px;fill:var(--ink);font-weight:640}
.g .ax{font-size:10.5px;fill:var(--mut)}
.g .gl{stroke:var(--line2);stroke-width:1}
.bar,.vbar{cursor:pointer;transition:opacity .15s}
.bar:hover,.vbar:hover{opacity:.82}
.bar{transform-origin:left center}
.vbar{transform-origin:center bottom}
.anim .bar{animation:gx .8s cubic-bezier(.22,.7,.3,1) both}
.anim .vbar{animation:gy .8s cubic-bezier(.22,.7,.3,1) both}
.anim .ln{animation:dash 1.4s ease both}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dash{from{stroke-dashoffset:2400}to{stroke-dashoffset:0}}
.ln{stroke-dasharray:2400}
.dot{transition:r .15s}.dot:hover{r:7}
.cell{cursor:pointer;transition:.15s}.cell:hover{stroke:var(--tp-blue-d);stroke-width:2}
/* legend + misc */
.lg{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;font-size:11.5px;color:var(--ink2)}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;
  vertical-align:-1px}
.note{font-size:12.5px;color:var(--ink2);margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line2)}
.note b{color:var(--ink)}
.pill{display:inline-block;padding:4px 11px;border-radius:16px;font-size:11.5px;font-weight:640;
  background:rgba(208,59,59,.10);color:var(--risk);margin-top:9px}
.pill.g{background:rgba(0,172,79,.11);color:#068A42}
/* simulator */
.sim{background:linear-gradient(135deg,var(--tp-blue-d),#013463 70%,#014A3A);color:#fff;
  border:0;padding:24px 26px}
.sim .vt,.sim .vs{color:#fff}.sim .vs{color:#9CC3E4}
.rng{width:100%;-webkit-appearance:none;height:6px;border-radius:4px;margin:20px 0 6px;
  background:linear-gradient(90deg,var(--tp-green) 0%,var(--tp-green) var(--p,0%),rgba(255,255,255,.20) var(--p,0%));outline:none}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:4px solid var(--tp-green);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.rng::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;
  border:4px solid var(--tp-green);cursor:pointer;border-color:var(--tp-green)}
.simg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.simc{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);
  border-radius:10px;padding:14px 16px}
.simc .v{font-size:26px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.simc .l{font-size:11.5px;color:#9CC3E4;margin-top:3px}
.simn{margin-top:16px;font-size:13.5px;color:#CFE4F5;background:rgba(0,0,0,.20);
  border-radius:9px;padding:13px 16px;border-left:3px solid var(--tp-green)}
/* accordion */
.acc{background:var(--surf);border:1px solid var(--line);border-radius:10px;margin-bottom:9px;
  overflow:hidden;transition:box-shadow .18s}
.acc:hover{box-shadow:var(--sh)}
.acc-h{width:100%;display:flex;align-items:center;gap:14px;padding:15px 18px;text-align:left}
.rk{flex:none;width:29px;height:29px;border-radius:8px;background:var(--tp-blue);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:680}
.acc:nth-child(-n+3) .rk{background:var(--risk)}
.acc-t{flex:1;font-size:13.8px;font-weight:560;min-width:0}
.cv{flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);
  transform:rotate(45deg);transition:transform .22s}
.acc.on .cv{transform:rotate(-135deg)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .3s ease}
.acc-i{padding:0 18px 17px 61px}
.acc-i .ins{margin:0 0 12px;font-size:13.5px;color:var(--ink)}
.acc-i .nums{font-size:11.5px;color:var(--mut);font-family:ui-monospace,Consolas,monospace;
  background:#F4F8FC;border-radius:7px;padding:9px 11px;margin:0 0 12px;line-height:1.65}
.acc-i .act{margin:0;font-size:13px;color:var(--ink2);padding-left:13px;
  border-left:3px solid var(--tp-green)}
.acc-i .act b{display:block;color:#068A42;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:3px}
/* plan */
.plan{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;
  box-shadow:var(--sh)}
.plan h4{font-size:15px;color:var(--tp-blue-d)}
.plan .pd{font-size:11.5px;color:var(--mut);margin-bottom:14px}
.plan ol{margin:0;padding-left:19px}
.plan li{font-size:13px;color:var(--ink2);margin-bottom:11px;padding-left:3px}
.plan li::marker{color:var(--tp-green);font-weight:700}
/* table */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surf);
  box-shadow:var(--sh);max-height:430px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--tp-blue);color:#fff;text-align:left;padding:11px 15px;
  font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;font-size:12.5px}
th:hover{background:#014C93}
th.a::after{content:" ▲"}th.d::after{content:" ▼"}
td{padding:10px 15px;border-top:1px solid var(--line2);color:var(--ink2)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#F3F8FD}
.bmini{display:inline-block;height:7px;border-radius:4px;vertical-align:1px;margin-right:7px}
@media(max-width:1180px){.c5{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(2,1fr)}
  .c3,.c23,.c32{grid-template-columns:1fr}.simg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}
  .c5,.c4,.c2{grid-template-columns:1fr}}
</style></head><body>

"inc": 18088.64, "rate": 0.0}], "top10": [{"rank": 1, "insight": "Overtime is the single strongest attrition driver in the dataset: 30.53% of overtime workers leave versus 10.44% of non-overtime workers (2.9x), and the 416 overtime employees (28.3% of headcount) supply 127 of 237 leavers — 53.6% of ALL attrition. Its chi-square (87.6) edges out even JobRole (86.2).", "numbers": "OT Yes: n=416, leavers=127, rate=30.53%; OT No: n=1054, leavers=110, rate=10.44%; chi2=87.6, p=8.16e-21; 127/237=53.6% of leavers from 28.3% of headcount", "recommendation": "Make OverTime the top-level filter on the attrition dashboard and launch an overtime-governance program (mandatory OT approval, workload rebalancing, comp-off); if the 416 OT workers left at the non-OT rate of 10.44%, expected leavers drop from 127 to ~43 — roughly 84 fewer exits, a 35% cut in total company attrition."}, {"rank": 2, "insight": "Risk is multiplicative, not additive: OverTime + JobLevel 1 churns at 52.56% (82 of 156) — roughly double either factor alone (JL1 26.34%, OT 30.53%) — and this 10.6%-of-headcount segment produces 34.6% of all company attrition; the closely overlapping OverTime + tenure <=2 years cell runs 50.96% (53 of 104), meaning every second overtime-loaded new joiner is lost.", "numbers": "OT+JobLevel1: n=156, leavers=82, rate=52.56% (82/237=34.6% of leavers from 156/1470=10.6% of headcount); JobLevel1 alone=26.34%, OT alone=30.53%; OT+Tenure<=2y: n=104, leavers=53, rate=50.96%; company avg=16.12%", "recommendation": "Build a named 156-person watch list (OT flag AND JobLevel=1) with monthly manager review, OT caps, and accelerated level-2 promotion paths, plus a no-overtime rule for the first 12 months of employment with HR sign-off exceptions; bringing the segment to the No-OT rate of 10.44% saves ~66 of its 82 leavers, and even halving the rate saves ~41 exits per year."}, {"rank": 3, "insight": "The lowest income band is the concentration point and overtime turns it into near-certain churn: the <$2.5K band holds 226 employees (15.4% of 1470) yet supplies 77 of 237 leavers (32.5%) at 34.07%, and the OverTime + Income<$2.5K cell loses 48 of 70 people (68.57%) — the worst segment in the entire dataset, where an employee is more likely to leave than to stay.", "numbers": "<2.5K band: n=226 (15.4%), leavers=77 (32.5% of 237), rate=34.07%; OT+Income<2.5K: n=70, leavers=48, rate=68.57%; next band 2.5-5K rate=16.44%; company rate=16.12%", "recommendation": "Introduce a pay floor lifting the <$2.5K band into the $2.5-5K band (which runs at 16.44%) and cap or premium-pay overtime for that band, starting with the 70 sub-$2.5K overtime workers: at the 16.44% band rate their expected leavers fall from 48 to ~12 (~36 saved from adjusting only 70 salaries), and band-wide the move retains roughly 30-40 of the 77 annual leavers — likely the highest-ROI action in the analysis."}, {"rank": 4, "insight": "Zero equity marks nearly two-thirds of all attrition: StockOptionLevel 0 covers 631 of 1470 people (42.9%) but 154 of 237 leavers (65%), churning at 24.41% versus 9.4% at level 1 — and the marginal value is entirely in the 0-to-1 step (level 3 rebounds to 17.65%). The gap compounds with life stage: all 470 Single employees sit at level 0 and churn at 25.53%, supplying 120 of 237 leavers (50.6%), rising to 49.62% (65 of 131) when overtime is added.", "numbers": "Level 0: n=631 (42.9%), leavers=154 (65%), rate=24.41%; level 1: n=596, rate=9.4%; level 2: n=158, rate=7.59%; level 3: n=85, rate=17.65%; chi2=60.6, p=4.38e-13; Single+zero-stock: n=470, leavers=120, rate=25.53% (50.6% of all leavers); OT+Single: 65/131, 49.62%", "recommendation": "Roll out a broad-based level-1 equity grant (or equivalent retention bonus vesting over 2-3 years) to the 631 zero-stock employees, prioritizing the 470-person zero-stock-and-single overlap, and audit award eligibility so grants follow role and performance rather than correlating with life stage; closing even a third of the 24.41%-vs-9.4% gap saves on the order of 25-30 leavers per year."}, {"rank": 5, "insight": "Attrition is front-loaded to an extreme degree: first-year employees churn at 34.88% (75 of 215), so 14.6% of headcount generates 31.6% of all attrition — the steepest cliff in the tenure curve, echoed by ages 18-25 at 35.77% (44 of 123). One in three new hires never reaches year two, and recruiting and onboarding spend is written off before payback.", "numbers": "Tenure 0-1: n=215 (14.6% of 1470), leavers=75 (31.6% of 237), rate=34.88%; next band 2-3y rate=18.43%; Age 18-25: n=123, leavers=44, rate=35.77%; mean age leavers 33.61 vs stayers 37.56 (p=1.38e-08)", "recommendation": "Deploy a structured 30-60-90-day onboarding program with mandatory buddy assignment and quarterly year-one stay interviews, protected by the first-year no-overtime window; bringing the 0-1y rate down to the 2-3y band level of 18.43% saves ~35 exits per year and cuts company attrition from 16.12% to roughly 13.7%."}, {"rank": 6, "insight": "Three cheap frontline roles produce 60% of all leavers, and in each the leavers were the underpaid ones: Laboratory Technician (62 leavers, 23.94%, leaver median $2,603 vs stayer $3,068, 15.2% gap), Research Scientist (47 leavers, 16.1%, $2,461 vs $2,936, 16.2% gap) and Sales Representative (33 leavers, 39.76% — the worst single-role rate — $2,325 vs $2,643, 12.0% gap) together account for 142 of 237 leavers; the Sales Rep + OverTime cell loses 16 of 24 people (66.67%).", "numbers": "Lab Tech: n=259, leavers=62, rate=23.94%, gap 15.2% (2603 vs 3068); Research Scientist: n=292, leavers=47, rate=16.1%, gap 16.2% (2461 vs 2936); Sales Rep: n=83, leavers=33, rate=39.76%, gap 12.0% (2325 vs 2643); OT+SalesRep: 16/24, 66.67%; combined 142/237=60%", "recommendation": "Commission an external market benchmark for exactly these three roles, bring below-median incumbents to role median (targeting the 12-16% within-role gaps), and ban routine overtime for Sales Representatives; a targeted 10-15% adjustment in three roles plausibly addresses a third or more of the 142 annual leavers at the lowest salary base in the company."}, {"rank": 7, "insight": "The reward system provides zero retention differentiation: top performers (rating 4) leave at 16.37% (37 of 226), statistically identical to rating-3 employees at 16.08%, and salary hikes are flat across outcomes (leavers 15.1% vs stayers 15.23% mean, median 14% for both, p=0.614) — the company loses 37 documented top-rated employees a year while paying flight risks and stars the same raise.", "numbers": "Rating 4: n=226, leavers=37, rate=16.37%; rating 3: n=1244, leavers=200, rate=16.08%; hike mean leavers=15.1 vs stayers=15.23, medians both 14.0, p=0.614, corr=-0.013", "recommendation": "Restructure the merit cycle to a differentiated matrix (8-10% baseline, 18-20% for rating-4 employees in high-attrition roles) funded by trimming raises in near-zero-attrition top income bands, and grant level-1 stock to rating-4 staff currently at level 0 (24.41% vs 9.4%); this directly targets and could preserve 15-20 of the 37 annual top-talent losses at flat total budget."}, {"rank": 8, "insight": "Satisfaction metrics are threshold effects, not gradients — the signal lives entirely at the bottom score: EnvironmentSatisfaction 1 churns at 25.35% (72 of 284, contributing 30% of all attrition) while levels 2-4 cluster at 13.45-14.98%; JobInvolvement 1 shows the steepest spread at 33.73% (28 of 83) vs 9.03% at level 4; WorkLifeBalance 1 runs 31.25% (25 of 80) while the 'best' score 4 actually churns higher than 3 (17.65% vs 14.22%). Broad wellbeing programs nudging averages upward will not move attrition.", "numbers": "EnvSat 1: 72/284, 25.35% vs levels 2/3/4: 14.98%/13.69%/13.45% (chi2=22.5, p=5.12e-05); JobInvolvement 1: 28/83, 33.73% vs level 4: 13/144, 9.03% (corr -0.13); WLB 1: 25/80, 31.25%; WLB 3: 14.22%; WLB 4: 27/153, 17.65%", "recommendation": "Replace blanket engagement spend with targeted triage of the bottom-score populations only — manager-led root-cause interviews and 90-day fix plans for the 284 EnvSat=1 (~29 savable exits), role-redesign conversations within 30 days for the 83 JobInvolvement=1 (~12 savable), and workload correction for the 80 WLB=1 (~14 savable)."}, {"rank": 9, "insight": "Promotion stagnation is a retention red herring while manager continuity is the real tenure-side signal: YearsSinceLastPromotion is statistically insignificant (leavers 1.95 vs stayers 2.23, p=0.199, corr -0.033) and long-stagnant veterans are the MOST loyal cohort (10y+ tenure with 7y+ no promotion: 13.79%; >7.5y promotion outliers: 12.15% — both below the 16.12% average); meanwhile leavers average 2.85 years with their current manager vs 4.37 for stayers (corr -0.156) and 2.9 vs 4.48 years in role (corr -0.161), roughly 5x stronger correlates.", "numbers": "YearsSinceLastPromotion: 1.95 vs 2.23, p=0.199, corr=-0.033; 10y+ tenure/7y+ no promo: n=116, leavers=16, rate=13.79%; outliers >7.5y: n=107, rate=12.15%; YearsWithCurrManager: 2.85 vs 4.37, p=1.19e-10, corr=-0.156; YearsInCurrentRole: 2.9 vs 4.48, p=3.19e-11, corr=-0.161", "recommendation": "Reallocate promotion-fairness retention budget away from long-tenured stagnant employees toward the 34.88% first-year cohort, add 'manager changes in last 24 months' as a tracked dashboard risk flag, and require HR review before reassigning employees in their first two years under a manager — same spend, redirected to where each point of improvement saves ~2 employees."}, {"rank": 10, "insight": "Single-KPI, rate-ranked reporting systematically misallocates leadership attention: the 16.12% headline conceals an 8.3x internal spread (68.57% in the worst cell vs 8.24% for No-OT JobLevel>=3); rate-ranking points executives at Sales (20.63%) while R&D supplies 133 of 237 leavers (56.1% of all replacement cost) at a below-average 13.84%; and of four pay fields only MonthlyIncome discriminates (corr -0.16, p=4.43e-13) — HourlyRate (p=0.791) and MonthlyRate (p=0.565) are pure noise, as is gender (p=0.291).", "numbers": "Spread: 68.57% (OT+<2.5K, 48/70) vs 8.24% (No OT+JobLevel>=3, 23/279) = 8.3x; Sales: 92/446, 20.63%; R&D: 133/961, 13.84%, 56.1% of leavers; MonthlyIncome: 4787.09 vs 6832.74, p=4.43e-13, corr=-0.16; HourlyRate p=0.791; MonthlyRate p=0.565; Gender: 17.01% vs 14.8%, chi2=1.1, p=0.291", "recommendation": "Redesign the BI deliverable around risk tiers instead of one KPI: a tiered heat map (OT status x JobLevel x income band) benchmarked against the 8.24% No-OT senior segment, dual rate-plus-absolute-count views per department, alerting when any segment exceeds 2x the company rate, and dropping HourlyRate, MonthlyRate, and gender as retention KPIs — converting the dashboard from descriptive to operational."}], "plan": {"quick_wins": ["Impose mandatory overtime approval and caps for JobLevel 1 staff and build the named 156-person OT+JobLevel-1 watch list with monthly manager review — normalizing this 52.56% segment even halfway saves ~41 exits per year.", "Institute a no-overtime policy for the first 12 months of employment (HR sign-off for exceptions) — bringing the OT + tenure<=2y rate of 50.96% (53 of 104) to the no-OT rate of 10.44% saves ~42 exits.", "Ban routine overtime for Sales Representatives immediately — cutting the 66.67% OT sub-segment (16 of 24) to the role base rate of 39.76% saves ~6 exits and protects the 83-person feeder pipeline for Sales Executive.", "Launch bottom-score triage lists for the 284 EnvSat=1, 83 JobInvolvement=1, and 80 WLB=1 employees with manager 1:1s and 90-day fix plans — worth roughly 29, 12, and 14 savable exits respectively.", "Adopt a 'no employee at zero trainings' rule with an automated HRIS report by Q3 — moving the 54-person zero-training cohort from 27.78% to the one-training rate of 12.68% saves ~8 exits for ~54 training seats.", "Rebuild the attrition dashboard now: OverTime as the top-level filter, dual rate-plus-count views, alerting at d mid-cycle promotion windows — closing a quarter of the 26.34%-vs-9.74% level gap retains ~22 additional employees per year.", "Institutionalize manager continuity: track 'manager changes in last 24 months' as a standing risk flag and require HR review before reassigning employees in their first two years under a manager (leavers average 2.85 vs 4.37 years with current manager, p=1.19e-10).", "Permanently reallocate retention spend away from proven-safe populations — the 114 earners above the $16,581 fence (4.39% attrition) and long-stagnant veterans (13.79%, promotion-lag p=0.199) — into the early-tenure and sub-$2.5K segments where rates run 34-69%.", "Build an early-career retention track (12/24-month career-path conversations, mentor pairing, accelerated first-promotion review) for the 729 employees aged 35 and under who supply 67.5% of all attrition — a 3-point reduction across the group saves ~22 exits per year.", "Launch a succession and knowledge-transfer program triggered at 20 years of tenure or age 55 — full coverage of the 66 employees at 21+ years (12.12% attrition) and 47 aged 56-60 (17.02%) is low-cost and converts unplanned senior exits into planned transitions.", "Make tiered risk-segment reporting (OT status x JobLevel x income band, benchmarked to the 8.24% No-OT senior rate) the permanent BI standard so the 8.3x internal risk spread stays visible to leadership and resource allocation follows the fire, not the average."]}, "otRate": 30.53, "noOtRate": 10.44, "otHead": 416, "noOtLv": 110, "avgIncLeavers": 4787.09, "avgIncStayers": 6832.74, "incomeOutliers": {"q1": 2911.0, "q3": 8379.0, "upper_fence": 16581.0, "n_outliers": 114, "outlier_attrition_rate": 4.39}};

document.addEventListener('mouseout',e=>{ if(e.target.closest('[data-tip]')) hideTip(); });

  if(tipEl.classList.contains('on')){
    const r=tipEl.getBoundingClientRect();
    let L=e.clientX+14,T=e.clientY+14;
    if(L+r.width>innerWidth-12)L=e.clientX-r.width-14;
    if(T+r.height>innerHeight-12)T=Math.max(12,e.clientY-r.height-14);
    tipEl.style.left=L+'px';tipEl.style.top=T+'px';}
});
const tp=(o)=>encodeURIComponent(
  `<h5>${esc(o.t)}</h5>${o.d?`<div>${o.d}</div>`:''}` +
  (o.why?`<span class="lbl">Why it matters</span><div>${o.why}</div>`:'') +
  (o.calc?`<span class="lbl">How it is calculated</span><code>${esc(o.calc)}</code>`:''));

/* ---------- KPI card ---------- */
function spark(vals,color,fill){
  const w=200,h=34,mx=Math.max(...vals),mn=Math.min(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i*(w/(vals.length-1)), h-3-((v-mn)/rg)*(h-9)]);
  const d=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg class="spk g" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${fill?`<polygon points="0,${h} ${d} ${w},${h}" fill="${color}" opacity=".13"/>`:''}
    <polyline points="${d}" fill="none" stroke="${color}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.2" fill="${color}"/>
  </svg>`;
}
function kpi(o){
  return `<div class="card">
    <div class="ch"><div><div class="ct">${o.t}</div><div class="cs">${o.s||''}</div></div>
      <div class="i" data-tip="${tp(o.tip)}">i</div></div>
    <div class="kv ${o.cls||''}">${o.v}</div>
    <div class="kd">${o.d||''}</div>
    ${o.spark?spark(o.spark.v,o.spark.c,o.spark.f):''}
    ${o.sl?`<div class="cs" style="margin-top:2px">${o.sl}</div>`:''}
  </div>`;
}
/* ---------- charts ---------- */
function hbar(data,o={}){
  o=Object.assign({w:900,rh:34,pl:200,bench:true,label:d=>d.k,unit:'%'},o);
  const mx=o.max||Math.max(...data.map(d=>d.rate))*1.24, h=data.length*o.rh+26,
        pw=o.w-o.pl-118;
  let s=`<svg class="g anim" viewBox="0 0 ${o.w} ${h}">`;
  if(o.bench){const bx=o.pl+pw*B/mx;
    s+=`<line x1="${bx}" y1="2" x2="${bx}" y2="${h-22}" stroke="${C.ink2}" stroke-width="1.2" stroke-dasharray="4 4"/>
        <text x="${bx+5}" y="${h-6}" class="ax">company avg ${B.toFixed(1)}%</text>`;}
  data.forEach((d,i)=>{
    const y=i*o.rh+4, w=pw*d.rate/mx, c=o.color?o.color(d):col(d.rate);
    const t=tp({t:o.label(d), d:`Attrition rate <b>${pc(d.rate)}</b> — ${d.lv} of ${d.n} employees left.`,
      why:d.rate>B?`Above the ${B.toFixed(1)}% company average by ${(d.rate-B).toFixed(1)} points.`
                  :`Below the company average by ${(B-d.rate).toFixed(1)} points.`,
      calc:`Attrition Rate % =\nDIVIDE( leavers, headcount )\n= ${d.lv} / ${d.n} = ${pc(d.rate)}`});
    s+=`<text x="${o.pl-11}" y="${y+19}" class="lb" text-anchor="end">${esc(o.label(d))}</text>
        <rect class="bar" x="${o.pl}" y="${y+5}" width="${w.toFixed(1)}" height="20" rx="3" fill="${c}"
          data-tip="${t}" style="animation-delay:${i*55}ms"/>
        <text x="${o.pl+w+8}" y="${y+20}" class="vl">${pc(d.rate)}</text>
        <text x="${o.pl+w+8+46}" y="${y+20}" class="ax">${d.lv}/${d.n}</text>`;
  });
  return s+'</svg>';
}
function vbar(data,o={}){
  o=Object.assign({w:520,h:250,bench:true,colors:null,sub:d=>'n='+d.n},o);
  const mx=o.max||Math.max(...data.map(d=>d.rate))*1.32,
        pt=24,pb=48,pl=34,pw=o.w-pl-14,ph=o.h-pt-pb,slot=pw/data.length,bw=Math.min(74,slot*.56);
  let s=`<svg class="g anim" viewBox="0 0 ${o.w} ${o.h}">`;
  for(let g=0;g<=3;g++){const gy=pt+ph*g/3;
    s+=`<line class="gl" x1="${pl}" y1="${gy}" x2="${o.w-8}" y2="${gy}"/>
        <text x="${pl-7}" y="${gy+4}" class="ax" text-anchor="end">${(mx*(1-g/3)).toFixed(0)}%</text>`;}
  if(o.bench){const by=pt+ph*(1-B/mx);
    s+=`<line x1="${pl}" y1="${by}" x2="${o.w-8}" y2="${by}" stroke="${C.ink2}" stroke-width="1.2" stroke-dasharray="4 4"/>`;}
  data.forEach((d,i)=>{
    const cx=pl+slot*i+slot/2, bh=ph*d.rate/mx, y=pt+ph-bh,
          c=o.colors?o.colors[i]:col(d.rate);
    const t=tp({t:d.k,d:`Attrition <b>${pc(d.rate)}</b> — ${d.lv} of ${d.n} left.`,
      why:d.rate>B?`${(d.rate/B).toFixed(1)}× the company average.`:`Safer than average.`,
      calc:`${d.lv} / ${d.n} = ${pc(d.rate)}`});
    s+=`<rect class="vbar" x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(bh,1)}" rx="3"
          fill="${c}" data-tip="${t}" style="animation-delay:${i*60}ms"/>
        <text x="${cx}" y="${y-7}" class="vl" text-anchor="middle">${pc(d.rate)}</text>
        <text x="${cx}" y="${o.h-26}" class="lb" text-anchor="middle">${esc(d.k)}</text>
        <text x="${cx}" y="${o.h-11}" class="ax" text-anchor="middle">${o.sub(d)}</text>`;
  });
  return s+'</svg>';
}
function line(data,o={}){
  o=Object.assign({w:560,h:250,xl:''},o);
  const mx=Math.max(...data.map(d=>d.rate))*1.3,pt=26,pb=46,pl=40,pr=18,
        pw=o.w-pl-pr,ph=o.h-pt-pb;
  const P=data.map((d,i)=>({x:pl+pw*i/(data.length-1),y:pt+ph*(1-d.rate/mx),d}));
  const path=P.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  let s=`<svg class="g anim" viewBox="0 0 ${o.w} ${o.h}">`;
  for(let g=0;g<=3;g++){const gy=pt+ph*g/3;
    s+=`<line class="gl" x1="${pl}" y1="${gy}" x2="${o.w-pr}" y2="${gy}"/>
        <text x="${pl-7}" y="${gy+4}" class="ax" text-anchor="end">${(mx*(1-g/3)).toFixed(0)}%</text>`;}
  s+=`<polygon points="${pl},${pt+ph} ${path} ${pl+pw},${pt+ph}" fill="${C.blue}" opacity=".11"/>
      <polyline class="ln" points="${path}" fill="none" stroke="${C.blue}" stroke-width="2.6"
        stroke-linejoin="round" stroke-linecap="round"/>`;
  const by=pt+ph*(1-B/mx);
  s+=`<line x1="${pl}" y1="${by}" x2="${o.w-pr}" y2="${by}" stroke="${C.ink2}" stroke-width="1.1" stroke-dasharray="4 4"/>`;
  P.forEach(p=>{
    const t=tp({t:p.d.k,d:`Attrition <b>${pc(p.d.rate)}</b> — ${p.d.lv} of ${p.d.n} left.`,
      calc:`${p.d.lv} / ${p.d.n} = ${pc(p.d.rate)}`});
    s+=`<circle class="dot" cx="${p.x}" cy="${p.y}" r="5.4" fill="${col(p.d.rate)}"
          stroke="#fff" stroke-width="2.2" data-tip="${t}"/>
        <text x="${p.x}" y="${p.y-13}" class="vl" text-anchor="middle">${pc(p.d.rate)}</text>
        <text x="${p.x}" y="${o.h-24}" class="lb" text-anchor="middle">${esc(p.d.k)}</text>`;});
  if(o.xl) s+=`<text x="${o.w/2}" y="${o.h-6}" class="ax" text-anchor="middle">${esc(o.xl)}</text>`;
  return s+'</svg>';
}
function heat(rows,o={}){
  const roles=[...new Set(rows.map(r=>r.JobRole||r.Department))];
  const cols=['No','Yes'], w=o.w||560, cw=112, pl=w-cw*2-14, rh=30, h=roles.length*rh+40;
  let s=`<svg class="g" viewBox="0 0 ${w} ${h}">`;
  cols.forEach((c,j)=>s+=`<text x="${pl+cw*j+cw/2}" y="16" class="lb" text-anchor="middle">${c==='Yes'?'Overtime':'No overtime'}</text>`);
  roles.forEach((r,i)=>{
    s+=`<text x="${pl-11}" y="${i*rh+44}" class="lb" text-anchor="end">${esc(r)}</text>`;
    cols.forEach((c,j)=>{
      const m=rows.find(x=>(x.JobRole||x.Department)===r&&x.OverTime===c);
      if(!m)return;
      const int=Math.min(m.rate/70,1), fill=m.rate>B
        ? `rgba(208,59,59,${(.14+int*.82).toFixed(2)})`
        : `rgba(0,61,119,${(.10+m.rate/40*.55).toFixed(2)})`;
      const t=tp({t:`${r} · ${c==='Yes'?'overtime':'no overtime'}`,
        d:`Attrition <b>${pc(m.rate)}</b> — ${m.lv} of ${m.n} employees.`,
        why:m.rate>50?'More than half of this group leaves — the most acute cell in the matrix.'
            :m.rate>B?`${(m.rate/B).toFixed(1)}× the company average.`:'Below the company average.',
        calc:`${m.lv} / ${m.n} = ${pc(m.rate)}`});
      s+=`<rect class="cell" x="${pl+cw*j+3}" y="${i*rh+26}" width="${cw-6}" height="${rh-6}" rx="5"
            fill="${fill}" data-tip="${t}"/>
          <text x="${pl+cw*j+cw/2}" y="${i*rh+44}" class="vl" text-anchor="middle"
            fill="${m.rate>32?'#fff':C.ink}">${pc(m.rate)}</text>`;});
  });
  return s+'</svg>';
}
function scatter(o={}){
  const w=o.w||560,h=o.h||330,pl=54,pb=42,pt=14,pr=14,pw=w-pl-pr,ph=h-pt-pb;
  const mxA=62,mnA=17,mxI=20000;
  let s=`<svg class="g" viewBox="0 0 ${w} ${h}">`;
  for(let g=0;g<=4;g++){const gy=pt+ph*g/4;
    s+=`<line class="gl" x1="${pl}" y1="${gy}" x2="${w-pr}" y2="${gy}"/>
        <text x="${pl-7}" y="${gy+4}" class="ax" text-anchor="end">$${((mxI*(1-g/4))/1000).toFixed(0)}K</text>`;}
  const fence=D.incomeOutliers.upper_fence, fy=pt+ph*(1-fence/mxI);
  s+=`<line x1="${pl}" y1="${fy}" x2="${w-pr}" y2="${fy}" stroke="${C.green}" stroke-width="1.4" stroke-dasharray="5 4"/>
      <text x="${w-pr}" y="${fy-6}" class="ax" text-anchor="end" fill="${C.green}">IQR outlier fence $${fmt(fence)} — only ${D.incomeOutliers.outlier_attrition_rate}% leave above it</text>`;
  D.scatter.forEach(p=>{
    const x=pl+pw*(p[0]-mnA)/(mxA-mnA), y=pt+ph*(1-p[1]/mxI);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${p[2]?2.9:2.2}"
          fill="${p[2]?C.risk:C.gb}" opacity="${p[2]?.82:.34}"/>`;});
  for(let a=20;a<=60;a+=10){const x=pl+pw*(a-mnA)/(mxA-mnA);
    s+=`<text x="${x}" y="${h-22}" class="ax" text-anchor="middle">${a}</text>`;}
  s+=`<text x="${pl+pw/2}" y="${h-6}" class="ax" text-anchor="middle">Age</text>`;
  return s+'</svg>';
}
function satGrid(){
  const map={JobSatisfaction:'Job satisfaction',EnvironmentSatisfaction:'Environment',
             WorkLifeBalance:'Work-life balance',JobInvolvement:'Job involvement'};
  let s='';
  for(const k in map){
    const rows=D.sat[k].map(r=>({k:'Score '+r.score,rate:r.rate,n:r.n,lv:Math.round(r.n*r.rate/100)}));
    s+=`<div class="card"><div class="vt">${map[k]}</div>
      <div class="vs">Score 1 is where nearly all the risk sits</div>${vbar(rows,{w:420,h:210})}</div>`;}
  return s;
}

  nav.querySelectorAll('.nv').forEach(n=>n.classList.toggle('on',n===b));

});
document.addEventListener('click',e=>{
  const h=e.target.closest('.acc-h'); if(!h)return;
  const a=h.parentElement, b=a.querySelector('.acc-b'), open=a.classList.toggle('on');
  b.style.maxHeight = open ? b.scrollHeight+'px' : '0px';
});
/* simulator */
const sl=document.getElementById('sl');
function sim(){
  const r=+sl.value/100;
  const simOt=D.otHead*((1-r)*D.otRate/100 + r*D.noOtRate/100);
  const total=D.noOtLv+simOt, rate=total/D.n*100, saved=D.leavers-total,
        cost=saved*D.avgIncLeavers*6;
  sl.style.setProperty('--p',(r*100)+'%');
  document.getElementById('slv').textContent=(r*100).toFixed(0)+'% reduction';
  document.getElementById('s1').textContent=rate.toFixed(2)+'%';
  document.getElementById('s2').textContent=Math.round(total).toLocaleString();
  document.getElementById('s3').textContent='+'+Math.round(saved).toLocaleString();
  document.getElementById('s4').textContent='$'+(cost/1e6).toFixed(2)+'M';
  document.getElementById('sn').innerHTML = r===0
    ? 'Move the slider to model the impact of an overtime-governance programme.'
    : `Cutting overtime exposure by <b>${(r*100).toFixed(0)}%</b> brings attrition from
       <b>16.12%</b> down to <b>${rate.toFixed(2)}%</b>, preventing <b>${Math.round(saved)} exits</b>
       and saving roughly <b>$${(cost/1e6).toFixed(2)}M</b> in replacement cost.`;
}
sl.addEventListener('input',sim); sim();

(function(){const t=document.getElementById('tb'); if(!t)return; let dir={};
